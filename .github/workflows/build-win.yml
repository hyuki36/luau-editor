name: Build Windows exe

# Chạy khi bạn đẩy tag v* (vd: v0.1.0) hoặc bấm nút Run workflow thủ công.
# Xong thì file exe nằm ở: Releases (nếu đẩy tag) + tab Actions > Artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: luau-editor
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build exe (nsis + portable)
        run: npm run dist:win

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luau-Editor-Windows
          path: luau-editor/release/*.exe

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: luau-editor/release/*.exe
          generate_release_notes: true
